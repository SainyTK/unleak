name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run pytest
        run: python -m pytest -q

  repo-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Check generated packaging copies
        run: python scripts/sync_packaging.py --check
      - name: Run branch analysis demo
        run: python examples/branch_analysis/run_demo.py
      - name: Run benchmark harness
        run: python benchmarks/run_benchmarks.py
      - name: Verify committed repo artifacts
        run: python scripts/verify_repo.py
