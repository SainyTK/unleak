name: Bug report
description: Report broken behavior in validation, hooks, packaging, examples, or docs.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible defects. Do not include raw sensitive data, credentials, or private customer information.
  - type: textarea
    id: summary
    attributes:
      label: What broke?
      description: Describe the observed behavior and why it is incorrect.
      placeholder: The validator passed a field that should have been blocked...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Share the minimal steps, commands, or fixture paths needed to reproduce the bug.
      placeholder: |
        1. Run ...
        2. Generate ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the behavior you expected instead.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Safety impact
      description: Note whether this can leak high-risk data, weaken enforcement, or only affects ergonomics.
      placeholder: This appears to allow exact monetary values through a sanitized artifact.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Environment
      description: Python version, OS, and any agent surface involved.
      placeholder: macOS 15, Python 3.11, Claude Code hooks
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Logs, validator output, screenshots, or links to related files.
