name: Question
description: Ask for clarification on safe usage, supported workflows, or project direction.
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Ask here when documentation or repo structure is ambiguous. Do not include raw sensitive data.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need clarified?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Share the relevant repo path, workflow, or install target.
      placeholder: I am trying to use the branch-analysis example with a project-level policy file.
  - type: dropdown
    id: kind
    attributes:
      label: Question type
      options:
        - Install and setup
        - Policy and validation semantics
        - Hook behavior
        - Example workflow
        - Benchmarks and evidence
        - Contribution process
        - Other
    validations:
      required: true
